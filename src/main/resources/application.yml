server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: portal-academico-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal_academico}
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:portal}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  endpoints:
    web:
      exposure:
        include: health,info
